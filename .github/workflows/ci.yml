name: CI

# Verification only. No job deploys anywhere; deployment returns in Phase 19
# behind a manual approval (ADR-0010). No repository secrets are used.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Lint, unit tests, secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install minimal Python test dependencies
        run: python -m pip install pytest==8.3.3 httpx==0.27.0
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test-unit
      - name: Secret scan
        run: make secrets

  sql-replay:
    name: Supabase migrations + RLS assertions (disposable Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Replay migrations, catalog import, and SQL assertions
        run: make test-db

  legacy-migrations:
    name: Legacy Alembic + JSOM bootstrap migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STEP2_PGHOST: localhost
      STEP2_PGPORT: "5432"
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install migration test dependencies
        run: >-
          python -m pip install "sqlalchemy[asyncio]==2.0.31" alembic==1.13.1 asyncpg==0.29.0
          pgvector==0.3.2 psycopg2-binary==2.9.9 pydantic==2.13.5 pydantic-settings==2.15.0 greenlet
      - name: Run migration tests
        run: make test-migrations

  backend-http:
    name: SyllabusCheck HTTP authorization tests (real app)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend requirements (without ML packages)
        run: |
          grep -vE '^--|^torch|^sentence-transformers|^spacy' implementations/syllabus-check/backend/requirements.txt > /tmp/req.txt
          python -m pip install -r /tmp/req.txt pytest==8.3.3
      - name: Run backend tests
        working-directory: implementations/syllabus-check/backend
        run: python -m pytest tests -v

  frontend-builds:
    name: Frontend build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: jsom-planner
            dir: implementations/jsom-planner/frontend
            install: npm ci --legacy-peer-deps
          - app: syllabus-check
            dir: implementations/syllabus-check/frontend
            install: npm ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.install }}
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: npm run build

  dependency-audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Known advisories are tracked in docs/phase-01/PHASE-01.md. This job
    # reports them without failing until the upgrade backlog is cleared.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit
        run: |
          for dir in implementations/jsom-planner/backend implementations/jsom-planner/frontend implementations/syllabus-check/frontend; do
            echo "== $dir"; (cd "$dir" && npm audit --omit=dev --audit-level=high) || echo "advisories found in $dir"
          done
      - name: pip-audit (direct pins)
        run: |
          python -m pip install pip-audit==2.7.3
          grep -vE '^--|^torch|^numpy|^#|^$' implementations/syllabus-check/backend/requirements.txt | sed 's/ *#.*//' > /tmp/req.txt
          pip-audit -r /tmp/req.txt --no-deps --disable-pip || echo "advisories found"
